<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Variables and Data Types</title>
</head>

<body>
    <h2>JavaScript Variables and Data Types</h2>
    <div id="out"></div>
    <script>
        let name = "Malleboina Kumar Venkata Narasimha Rao";
        const age = 21;
        let isStudent = true;
        let marks = 89;
        let address = "A.konduru";
        let result = "";
        result += "name = " + name + " (" + typeof name + ")<br>";
        result += "age = " + age + " (" + typeof age + ")<br>";
        result += "isStudent = " + isStudent + " (" + typeof isStudent + ")<br>";
        result += "marks = " + marks + " (" + typeof marks + ")<br>";
        result += "address = " + address + " (" + typeof address + ")<br>";
        document.getElementById("out").innerHTML = result;     </script>
</body>

</html>
